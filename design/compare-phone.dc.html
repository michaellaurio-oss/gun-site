<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compare guns – phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#16181a;background:#f7f6f3}
a{color:#16181a;text-decoration:none}a:hover{color:#8f3f12}
</style>
</helmet>
<div style="width: 390px; height: 1960px; box-sizing: border-box; display: flex; flex-direction: column; background: #f7f6f3; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #16181a;">

<header style="display: flex; align-items: center; gap: 12px; height: 68px; flex-shrink: 0; padding: 0 16px; border-bottom: 1px solid #e3e1dc; background: #ffffff;">
<a href="#" style="font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.02em;">Crosshairs Gun Store</a>
<button type="button" aria-label="Menu" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #d6d3cc; border-radius: 8px; background: #ffffff; cursor: pointer;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
</header>

<section style="padding: 24px 16px 16px; display: flex; flex-direction: column; gap: 14px;">
<div>
<div style="font-size: 13px; color: #5a5e63;">Inventory / Compare</div>
<h1 style="margin: 6px 0 0; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 36px; line-height: 1.05; letter-spacing: -0.03em;">Compare</h1>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<label style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; font-weight: 500;">
<input type="checkbox" checked="{{diffOnly}}" onChange="{{toggleDiff}}" style="width: 18px; height: 18px; margin: 0; accent-color: #16181a;">
Differences only
</label>
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid #c9c5bc; border-radius: 8px; background: #ffffff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
Share</button>
</div>
</section>

<!-- Pager: 2 guns at a time -->
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px 12px;">
<button type="button" onClick="{{prev}}" disabled="{{atStart}}" aria-label="Previous guns" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #e3e1dc; border-radius: 8px; background: #ffffff; color: {{prevColor}}; cursor: pointer;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div style="font-size: 14px; color: #43474c;"><b style="font-weight: 600; color: #16181a;">{{rangeText}}</b> of {{total}} guns</div>
<button type="button" onClick="{{next}}" disabled="{{atEnd}}" aria-label="Next guns" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #e3e1dc; border-radius: 8px; background: #ffffff; color: {{nextColor}}; cursor: pointer;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>

<div style="margin: 0 16px; border: 1px solid #e3e1dc; border-radius: 12px; background: #ffffff; overflow: hidden;">
<!-- Gun heads (sticky while scrolling on the live site) -->
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #d6d3cc;">
<sc-for list="{{heads}}" as="h" hint-placeholder-count="2">
<div style="position: relative; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-left: {{h.divider}}; min-width: 0;">
<div style="aspect-ratio: 4 / 3; border-radius: 8px; background: #ebe8e2; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #6b6f74; font-size: 11px; text-align: center;">
<sc-if value="{{h.hasPhoto}}" hint-placeholder-val="{{ false }}"><img src="/_blob/624af96b02d73c3b890a4338062e328e" alt="" style="width: 100%; height: 100%; object-fit: cover;"></sc-if>
<sc-if value="{{h.noPhoto}}" hint-placeholder-val="{{ true }}"><span>Photo coming soon</span></sc-if>
</div>
<button type="button" aria-label="Remove {{h.name}}" style="position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: rgba(255,255,255,0.92); box-shadow: 0 1px 4px rgba(22,24,26,0.15); cursor: pointer;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<span style="align-self: flex-start; padding: 2px 8px; border-radius: 999px; background: {{h.stBg}}; color: {{h.stFg}}; font-size: 11px; font-weight: 600;">{{h.status}}</span>
<div style="min-width: 0;">
<div style="font-size: 12px; color: #5a5e63;">{{h.make}}</div>
<a href="#" style="display: block; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 16px; line-height: 1.2;">{{h.model}}</a>
</div>
<div style="font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 20px;">{{h.price}}</div>
<a href="#" style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 8px; background: #b4541a; color: #ffffff; font-weight: 600; font-size: 14px;">Ask</a>
</div>
</sc-for>
</div>

<!-- Rows: label on its own line, values side by side -->
<sc-for list="{{rows}}" as="r" hint-placeholder-count="18">
<sc-if value="{{r.isGroup}}" hint-placeholder-val="{{ false }}">
<div style="padding: 14px 12px 8px; background: #f7f6f3; border-bottom: 1px solid #e3e1dc; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px;">{{r.label}}</div>
</sc-if>
<sc-if value="{{r.isRow}}" hint-placeholder-val="{{ true }}">
<div style="border-bottom: 1px solid #eeece7;">
<div style="padding: 10px 12px 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6b6f74;">{{r.label}}</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));">
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="2">
<div style="padding: 4px 12px 10px; min-width: 0;">
<div style="font-family: {{c.font}}; font-size: 14px; font-weight: 500; line-height: 1.4; white-space: pre-line; color: {{c.color}};">{{c.v}}</div>
<sc-if value="{{c.hasSub}}" hint-placeholder-val="{{ false }}"><div style="font-size: 11px; line-height: 1.3; color: #6b6f74;">{{c.sub}}</div></sc-if>
</div>
</sc-for>
</div>
</div>
</sc-if>
</sc-for>
</div>

<footer style="margin-top: auto; flex-shrink: 0; padding: 28px 16px; background: #ffffff; border-top: 1px solid #e3e1dc; font-size: 13px; color: #43474c;">
<div style="font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 17px; color: #16181a;">Crosshairs Gun Store</div>
<div style="margin-top: 4px;">Torrance, CA · Tue–Sat 11 AM–6 PM</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1960}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const DASH = '—';
    const ST = { available: { label: 'Available', fg: '#1f5a40', bg: '#e4efe9' }, on_hold: { label: 'On hold', fg: '#7a4f00', bg: '#fbeed3' } };
    const GUNS = [
      { make: 'CZ', model: '75 SP-01', price: '$1,700', status: 'available', photo: true, d: { newused: 'Used', condition: 'Excellent', rounds: '~1,000', roster: 'Off roster', mods: 'Cajun Pro Package\nNight Fision sights', included: 'Original packaging', type: 'Handgun', caliber: '9mm Luger', action: 'Semi-auto, DA/SA', capacity: '10 rounds', barrel: '4.6 in · 116.8 mm', length: '8.2 in · 208.3 mm', weight: '41.3 oz · 1,171 g', trigger: '4.5 SA · 10.3 DA lb', frame: 'Steel', msrp: '$999' } },
      { make: 'Glock', model: 'G19', price: '$499', status: 'available', d: { newused: 'Used', condition: 'Very Good', rounds: '~500', roster: 'On roster', mods: 'None', included: '2 magazines, case', type: 'Handgun', caliber: '9mm Luger', action: 'Semi-auto, striker', capacity: '15 rounds', capacitySub: '(10 round limit in CA)', barrel: '4.02 in · 102.1 mm', length: '7.36 in · 186.9 mm', weight: '23.63 oz · 670 g', trigger: '6.29 lb', frame: 'Polymer', msrp: DASH } },
      { make: 'CZ', model: '75 D PCR Compact', price: '$649', status: 'on_hold', d: { newused: 'Used', condition: 'Like New', rounds: '~200', roster: 'Off roster', mods: 'None', included: 'Box, 2 magazines', type: 'Handgun', caliber: '9mm Luger', action: 'Semi-auto, DA/SA', capacity: '10 rounds', barrel: '3.75 in · 95.3 mm', length: '7.25 in · 184.1 mm', weight: '27.5 oz · 780 g', trigger: '4.5 SA · 10.3 DA lb', frame: 'Aluminum', msrp: '$899' } },
      { make: 'Marlin', model: '1894 Trapper', price: '$1,399', status: 'available', d: { newused: 'New', condition: 'New', rounds: '0', roster: 'Not required', mods: 'None', included: 'Factory box', type: 'Rifle', caliber: '.357 Mag / .38 Spl', action: 'Lever action', capacity: '8 rounds', barrel: '16.1 in · 408.9 mm', length: '33.25 in · 844.5 mm', weight: '6.3 lb · 2,858 g', trigger: DASH, frame: 'Stainless steel', msrp: '$1,599' } }
    ];
    const ROWS = [
      { group: 'Listing' }, { k: 'newused', label: 'New / used' }, { k: 'condition', label: 'Condition' }, { k: 'rounds', label: 'Est. round count', mono: true }, { k: 'roster', label: 'CA roster' }, { k: 'mods', label: 'Modifications' }, { k: 'included', label: 'Included' },
      { group: 'Specifications' }, { k: 'type', label: 'Type' }, { k: 'caliber', label: 'Caliber' }, { k: 'action', label: 'Action' }, { k: 'capacity', label: 'Capacity' }, { k: 'barrel', label: 'Barrel length', mono: true }, { k: 'length', label: 'Overall length', mono: true }, { k: 'weight', label: 'Weight', mono: true }, { k: 'trigger', label: 'Trigger pull', mono: true }, { k: 'frame', label: 'Frame' }, { k: 'msrp', label: 'MSRP (new)', mono: true }
    ];
    const start = s.start || 0;
    const pair = GUNS.slice(start, start + 2);
    const diffOnly = !!s.diff;
    const rows = [];
    ROWS.forEach((r) => {
      if (r.group) { rows.push({ isGroup: true, isRow: false, label: r.group, cells: [] }); return; }
      // differences are judged across ALL guns being compared, not just the two on screen
      const differs = new Set(GUNS.map((g) => g.d[r.k] || DASH)).size > 1;
      if (diffOnly && !differs) return;
      rows.push({ isGroup: false, isRow: true, label: r.label, cells: pair.map((g) => {
        const v = g.d[r.k] || DASH; const sub = g.d[r.k + 'Sub'] || '';
        return { v, sub, hasSub: !!sub, font: r.mono && v !== DASH ? "'IBM Plex Mono', monospace" : "'IBM Plex Sans', sans-serif", color: v === DASH ? '#9a9da1' : '#16181a' };
      }) });
    });
    const clean = rows.filter((r, i) => !(r.isGroup && (i === rows.length - 1 || rows[i + 1].isGroup)));
    const last = GUNS.length - 2;
    return {
      diffOnly,
      toggleDiff: () => this.setState({ diff: !diffOnly }),
      total: GUNS.length,
      rangeText: (start + 1) + '–' + (start + pair.length),
      atStart: start <= 0, atEnd: start >= last,
      prevColor: start <= 0 ? '#c9c5bc' : '#16181a', nextColor: start >= last ? '#c9c5bc' : '#16181a',
      prev: () => this.setState({ start: Math.max(0, start - 2) }),
      next: () => this.setState({ start: Math.min(last, start + 2) }),
      heads: pair.map((g, i) => { const st = ST[g.status]; return { make: g.make, model: g.model, name: g.make + ' ' + g.model, price: g.price, status: st.label, stFg: st.fg, stBg: st.bg, hasPhoto: !!g.photo, noPhoto: !g.photo, divider: i === 0 ? '0' : '1px solid #eeece7' }; }),
      rows: clean
    };
  }
}
</script>
</body>
</html>
